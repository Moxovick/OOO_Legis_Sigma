server {
    listen 80;
    server_name legis-teh.com www.legis-teh.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name legis-teh.com www.legis-teh.com;

    ssl_certificate     /etc/letsencrypt/live/legis-teh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legis-teh.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Uploads (served directly, bypass Next.js)
    location /uploads/ {
        alias /var/www/legis-new/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Rate limiting only on public POST endpoints (leads / login)
    location = /api/leads {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=leads burst=5 nodelay;
    }

    location = /api/admin/login {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=login burst=3 nodelay;
    }

    # All other API endpoints (no nginx rate limit — slowapi handles it)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (Next.js)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# Rate limiting zones (defined at http level, included from sites-available)
limit_req_zone $binary_remote_addr zone=leads:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
